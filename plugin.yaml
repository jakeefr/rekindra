name: rekindra
version: 0.2.0
description: Recover forgotten images and create source-backed original animated scenes with portable browser and WebM output.
author: Jake Werner
python_dependencies:
  - pypdf==6.16.1
provides_tools:
  - rekindra_inspect
  - rekindra_recover
  - rekindra_status
  - rekindra_plan
  - rekindra_build
  - rekindra_compose
  - rekindra_create_world
  - rekindra_preview
  - rekindra_revise_world
