name: rekindra
version: 0.2.0
requires_hermes: ">=0.22.7"
description: Recover forgotten images and create source-backed original animated scenes with portable browser and WebM output.
author: Jake Werner
license: MIT
python_dependencies:
  - pypdf>=6.21.4,<7
  - Pillow>=13.0.0,<14
provides_tools:
  - rekindra_inspect
  - rekindra_recover
  - rekindra_status
  - rekindra_reconstruct
  - rekindra_plan
  - rekindra_build
  - rekindra_compose
  - rekindra_create_world
  - rekindra_preview
  - rekindra_export
  - rekindra_revise_world
